# Build the discs and run every check (make check) on a Model B and a
# Master 128, for each edition (docs/streaming.md), with baron pinned to a
# release.
name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  BARON_VERSION: v0.6.0

jobs:
  check:
    name: make check (${{ matrix.model }}${{ matrix.stream && ', streaming' || '' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        model: [B-DFS1.2, Master]
        stream: ["", "1"]
    steps:
      - uses: actions/checkout@v4

      - name: Cache baron
        id: baron
        uses: actions/cache@v4
        with:
          path: baron-bin
          key: baron-${{ env.BARON_VERSION }}-${{ runner.os }}

      - name: Build baron ${{ env.BARON_VERSION }}
        if: steps.baron.outputs.cache-hit != 'true'
        run: |
          git clone --quiet --depth 1 --branch "$BARON_VERSION" --recurse-submodules \
            https://github.com/waitingforvsync/baron baron-src
          cmake -S baron-src -B baron-src/build -DCMAKE_BUILD_TYPE=Release
          cmake --build baron-src/build -j
          mkdir -p baron-bin
          cp baron-src/build/src/baron baron-bin/

      # The Spectrum original isn't ours to commit: make fetch downloads it
      # from Spectrum Computing and checks it against original/SHA256SUMS.
      # Cached, so it isn't fetched on every run.
      - name: Cache the original
        uses: actions/cache@v4
        with:
          path: |
            original/*
            !original/README.md
            !original/SHA256SUMS
          key: original-${{ hashFiles('original/SHA256SUMS') }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: astral-sh/setup-uv@v6

      - name: Set up
        run: |
          npm ci
          make venv
          make fetch

      # The original's side of make passes and make entry
      # (tools/zxcache.py), kept between runs and shared by the matrix's
      # jobs. The key changes with the loggers, the scenarios, the original
      # and SkoolKit's version (make venv installs the latest), as the
      # cache is only saved under a new key; entries are keyed by their
      # whole command line inside, so the last cache's still-valid ones
      # are restored and reused.
      - name: SkoolKit's version
        id: skoolkit
        run: echo "version=$(.venv/bin/python -c 'import importlib.metadata as m; print(m.version("skoolkit"))')" >> "$GITHUB_OUTPUT"

      - name: Cache the original's logs
        uses: actions/cache@v4
        with:
          path: build/zxcache
          key: zxcache-${{ steps.skoolkit.outputs.version }}-${{ hashFiles('tools/zx.py', 'tools/passlog.py', 'tools/entrylog.py', 'tools/zxcache.py', 'original/SHA256SUMS', 'tests/scenarios.txt', 'tools/entrycheck.mjs') }}
          restore-keys: zxcache-${{ steps.skoolkit.outputs.version }}-

      - name: make check
        run: make check MODEL=${{ matrix.model }} STREAM=${{ matrix.stream }} BARON="$PWD/baron-bin/baron"
